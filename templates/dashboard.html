<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center fixed;
    background-size: cover;
}

.overlay {
    background: rgba(0, 0, 0, 0.7);
    position: fixed;
    width: 100%;
    height: 100%;
}

.container {
    width: 65%;
    margin: 90px auto;
    background: rgba(255, 255, 255, 0.95);
    padding: 35px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    position: relative;
    z-index: 1;
}

.role {
    color: #007BFF;
    font-size: 18px;
    margin-bottom: 20px;
}

.btn {
    margin: 12px;
    padding: 14px 30px;
    background: linear-gradient(45deg, #007BFF, #00C6FF);
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.08);
}

.logout {
    background: linear-gradient(45deg,#dc3545,#ff6b6b);
}
</style>
</head>

<body>
<div class="overlay"></div>

<div class="container">
    <h1>Fake Profile Detection System</h1>

    <p class="role">
        Welcome, <strong>{{ role | capitalize }}</strong>
    </p>

    <a href="/check_profile"><button class="btn">Check Profile</button></a>
    <a href="/statistics"><button class="btn">Statistics</button></a>
    <a href="/about"><button class="btn">About</button></a>
    <a href="/contact"><button class="btn">Contact</button></a>

    <br><br>

    <a href="/logout"><button class="btn logout">Logout</button></a>
</div>

</body>
</html>
